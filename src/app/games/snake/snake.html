<div class="game-wrapper">

  <!-- HUD -->
  <div class="hud">

    @if (!started) {
      <button class="btn primary" (click)="startGame()">START</button>
    }

    @if (started && !gameOver) {
      <button class="btn secondary" (click)="togglePause()">
        {{ paused ? 'RESUME' : 'PAUSE' }}
      </button>
    }

    <button class="btn back" routerLink="/">←</button>

  </div>

  <!-- Canvas -->
  <canvas #canvas></canvas>

  <!-- Modal -->
  <div class="modal" [class.show]="gameOver">
    <div class="modal-content">
      <h2>GAME OVER</h2>
      <p>Puntuación: {{ score }}</p>

      <div class="modal-actions">
        <button class="btn primary" (click)="restart()">Reiniciar</button>
        <button class="btn secondary" routerLink="/">Home</button>
      </div>
    </div>
  </div>

</div>
