<div class="game-layout animate-fade-in">
  <header class="game-header">
    <a routerLink="/" class="back-btn">← Volver</a>
    <h1 class="logo">3 en Raya <span>❌⭕</span></h1>
  </header>

  <main class="game-card-flat">
    <div class="status-hud">
      <div class="status-item">
        <span class="status-label">MODO</span>
        <span class="status-value">
          {{ game.isVsAI ? 'Jugador vs IA' : 'Jugador vs Jugador' }}
        </span>
      </div>

      <div class="status-item">
        <span class="status-label">ESTADO</span>
        <span class="status-value">{{ status }}</span>
      </div>

      <div class="status-actions">
        <button class="btn-mode" (click)="toggleAI()">
          {{ game.isVsAI ? 'Cambiar a 2 jugadores' : 'Cambiar a IA' }}
        </button>
        <button class="btn-primary" (click)="reset()">Reiniciar</button>
      </div>
    </div>

    <div class="board-container">
      <app-board></app-board>
    </div>
  </main>

  @if (game.winner || (game.isDraw && !game.winner)) {
    <div class="modal-overlay animate-fade-in">
      <div class="modal-content glass">
        @if (game.winner) {
          <h2 class="modal-title">¡Victoria de {{ game.winner }}!</h2>
        }

        @if (game.isDraw && !game.winner) {
          <h2 class="modal-title">¡Empate!</h2>
        }

        <button class="btn-primary" (click)="reset()">Jugar de nuevo</button>
      </div>
    </div>
  }
</div>
